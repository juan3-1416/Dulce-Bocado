services:
  payment-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dulce_payment_test
      POSTGRES_USER: payment_test
      POSTGRES_PASSWORD: payment_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_test -d dulce_payment_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  payment-test:
    build: ./microservices/payment-service
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: payment-test-db
      DB_PORT: 5432
      DB_DATABASE: dulce_payment_test
      DB_USERNAME: payment_test
      DB_PASSWORD: payment_test_only
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
    depends_on:
      payment-test-db:
        condition: service_healthy
    command: ["php", "artisan", "test", "--compact"]
