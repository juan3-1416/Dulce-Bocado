services:
  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulce_orders
      POSTGRES_USER: dulce_orders_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-dulce_orders_local_only}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulce_orders_user -d dulce_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dulce_bocado_net

  order-service:
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./microservices/order-service/.env
    volumes:
      - ./microservices/order-service:/var/www/html
      - order_vendor:/var/www/html/vendor
    environment:
      APP_NAME: Dulce Bocado Orders
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: order-db
      DB_PORT: 5432
      DB_DATABASE: dulce_orders
      DB_USERNAME: dulce_orders_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-dulce_orders_local_only}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dulce_bocado_net

volumes:
  order_postgres_data:
  order_vendor:
