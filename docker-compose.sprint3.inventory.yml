services:
  inventory-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulce_inventory
      POSTGRES_USER: dulce_inventory_user
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-dulce_inventory_local_only}
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dulce_inventory_user -d dulce_inventory"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dulce_bocado_net

  inventory-service:
    build:
      context: ./microservices/inventory-service
      dockerfile: Dockerfile
    image: dulce-bocado-inventory-service:local
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./microservices/inventory-service/.env
    volumes:
      - ./microservices/inventory-service:/var/www/html
      - inventory_vendor:/var/www/html/vendor
    environment:
      APP_NAME: Dulce Bocado Inventory
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: pgsql
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_DATABASE: dulce_inventory
      DB_USERNAME: dulce_inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-dulce_inventory_local_only}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

    depends_on:
      inventory-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - dulce_bocado_net

volumes:
  inventory_postgres_data:
  inventory_vendor: