services:
  production-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulce_production
      POSTGRES_USER: dulce_production_user
      POSTGRES_PASSWORD: ${PRODUCTION_DB_PASSWORD:-dulce_production_local_only}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulce_production_user -d dulce_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dulce_bocado_net

  production-service:
    build:
      context: ./microservices/production-service
      dockerfile: Dockerfile
    image: dulce-bocado-production-service:local
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./microservices/production-service/.env
    volumes:
      - ./microservices/production-service:/var/www/html
      - production_vendor:/var/www/html/vendor
    environment:
      APP_NAME: Dulce Bocado Production
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: production-db
      DB_PORT: 5432
      DB_DATABASE: dulce_production
      DB_USERNAME: dulce_production_user
      DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:-dulce_production_local_only}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      production-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dulce_bocado_net

  production-scheduler:
    image: dulce-bocado-production-service:local
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ./microservices/production-service/.env
    volumes:
      - ./microservices/production-service:/var/www/html
      - production_vendor:/var/www/html/vendor
    environment:
      APP_NAME: Dulce Bocado Production
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: production-db
      DB_PORT: 5432
      DB_DATABASE: dulce_production
      DB_USERNAME: dulce_production_user
      DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:-dulce_production_local_only}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      production-service:
        condition: service_healthy
    networks:
      - dulce_bocado_net

volumes:
  production_postgres_data:
  production_vendor:
