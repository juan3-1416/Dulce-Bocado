services:
  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulce_payment
      POSTGRES_USER: dulce_payment_user
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-dulce_payment_local_only}
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulce_payment_user -d dulce_payment"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dulce_bocado_net

  payment-service:
    build:
      context: ./microservices/payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - ./microservices/payment-service/.env

    volumes:
      - ./microservices/payment-service:/var/www/html
      - payment_vendor:/var/www/html/vendor

    environment:
      PAYMENT_ORDER_INTERNAL_KEY: ${PAYMENT_ORDER_INTERNAL_KEY:?Clave interna de Order requerida}
      APP_NAME: Dulce Bocado Payment
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: pgsql
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_DATABASE: dulce_payment
      DB_USERNAME: dulce_payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-dulce_payment_local_only}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      SECURITY_SERVICE_URL: http://security-service:8000
      SALES_SERVICE_URL: http://sales-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000

    depends_on:
      payment-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - dulce_bocado_net

volumes:
  payment_postgres_data:
  payment_vendor: