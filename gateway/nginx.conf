events {}

http {
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $security_target security-service:8000;
        set $customer_target customer-service:8000;
        set $sales_target sales-service:8000;
        set $catalog_target catalog-service:8000;
        set $order_target order-service:8000;
        set $production_target production-service:8000;
        set $inventory_target inventory-service:8000;
        set $payment_target payment-service:8000;
        set $legacy_target backend:8000;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "gateway-ok";
        }

        # Introspeccion de Security: solo uso interno.
        location = /api/internal/introspect {
            return 404;
        }

        # Security Service
        location /api/auth/ {
            proxy_pass http://$security_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/usuarios {
            proxy_pass http://$security_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/roles {
            proxy_pass http://$security_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/permisos {
            proxy_pass http://$security_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/asignaciones {
            proxy_pass http://$security_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Payment Service: publicar solo los endpoints implementados.
        location = /api/pagos {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location = /api/pagos/efectivo {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Payment Service: Pagos QR Libélula (HU12)
        location = /api/pagos/qr {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ^~ /api/pagos/qr/ {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Payment Service: Recibos internos (HU13)
        location = /api/recibos {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ^~ /api/recibos/ {
            proxy_pass http://$payment_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Sales Service
        location = /api/ventas {
            proxy_pass http://$sales_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location ^~ /api/ventas/ {
            proxy_pass http://$sales_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Customer Service
        location = /api/clientes {
            proxy_pass http://$customer_target$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ^~ /api/clientes/ {
            proxy_pass http://$customer_target$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }
        # Rutas exactas para no capturar /api/productos/* del monolito.
        location ~ ^/api/(categorias|productos|presentaciones)$ {
            proxy_pass http://$catalog_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ~ ^/api/(categorias|productos|presentaciones)/[0-9]+$ {
            proxy_pass http://$catalog_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ~ ^/api/(recetas|materias-primas)(/[0-9]+(/estado)?)?$ {
            proxy_pass http://$catalog_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ~ ^/api/presentaciones/[0-9]+/receta$ {
            proxy_pass http://$catalog_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Order Service
        location = /api/pedidos {
            proxy_pass http://$order_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ^~ /api/pedidos/ {
            proxy_pass http://$order_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Production Service: solo rutas publicas. El ID idempotente se conserva.
        location = /api/producciones {
            proxy_pass http://$production_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        location ^~ /api/producciones/ {
            proxy_pass http://$production_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }


        # Inventory Service: solo rutas publicas.
        location ~ ^/api/(almacenes|existencias|movimientos|ingresos|egresos|traslados)$ {
            proxy_pass http://$inventory_target$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;

            # Nunca confiar en headers internos enviados por el navegador.
            proxy_set_header X-Internal-Service-Key "";
            proxy_set_header X-Actor-User-Id "";
        }

        # Las rutas internas entre microservicios nunca se publican.
        location ^~ /internal/ {
            return 404;
        }
        # Rutas que todavia pertenecen al monolito.
        location /api/ {
            proxy_pass http://$legacy_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /sanctum/ {
            proxy_pass http://$legacy_target$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
